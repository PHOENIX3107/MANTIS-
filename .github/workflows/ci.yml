name: SYNCRO1 CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, gd, mysqli, xml, zip, curl
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: PHP syntax
        run: find plugins/Syncro1 syncro1 -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - uses: koalaman/shellcheck-action@v2
        with:
          scandir: syncro1
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=syncro1/infra/terraform fmt -check -recursive
      - run: terraform -chdir=syncro1/infra/terraform init -backend=false
      - run: terraform -chdir=syncro1/infra/terraform validate

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose -f syncro1/docker/docker-compose.yml up --build -d
      - run: curl --fail --retry 30 --retry-delay 2 http://localhost:8080/healthz
      - run: docker compose -f syncro1/docker/docker-compose.yml exec -T php-fpm php syncro1/tests/test_email_policy.php
      - run: docker compose -f syncro1/docker/docker-compose.yml exec -T php-fpm syncro1/scripts/audit-users.php
      - run: docker compose -f syncro1/docker/docker-compose.yml exec -T php-fpm syncro1/scripts/verify-config-options
      - run: docker compose -f syncro1/docker/docker-compose.yml exec -T php-fpm syncro1/scripts/healthcheck.php
      - run: SYNCRO1_BASE_URL=http://localhost:8080 MAILPIT_URL=http://localhost:8025 syncro1/tests/smoke.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: always()
        run: docker compose -f syncro1/docker/docker-compose.yml down -v
